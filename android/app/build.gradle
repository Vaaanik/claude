plugins {
    id "com.android.application"
}

android {
    namespace "ua.svitlo.widget"
    compileSdk 35

    defaultConfig {
        applicationId "ua.svitlo.widget"
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName "4.1"
    }

    signingConfigs {
        // Постоянный ключ, чтобы обновления ставились поверх старой версии.
        shared {
            storeFile file("../widget.keystore")
            storePassword "android"
            keyAlias "widget"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

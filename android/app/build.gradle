plugins {
    id "com.android.application"
}

// Настройки Firebase берутся из google-services.json (файл из консоли Firebase).
// Без него приложение собирается и работает в режиме «телефон сам опрашивает каналы».
def fcm = [project: "", app: "", key: "", sender: ""]
def gs = file("google-services.json")
if (gs.exists()) {
    def j = new groovy.json.JsonSlurper().parse(gs)
    def client = j.client.find { it.client_info.android_client_info.package_name == "ua.svitlo.widget" }
    if (client != null) {
        fcm.project = j.project_info.project_id
        fcm.sender = j.project_info.project_number
        fcm.app = client.client_info.mobilesdk_app_id
        fcm.key = client.api_key[0].current_key
    }
}

android {
    namespace "ua.svitlo.widget"
    compileSdk 35

    defaultConfig {
        applicationId "ua.svitlo.widget"
        minSdk 26
        targetSdk 35
        // В CI номер сборки задаётся автоматически (-PbuildNumber=...), чтобы каждая
        // новая сборка была «новее» установленной и ставилась автообновлением.
        versionCode((project.findProperty("buildNumber") ?: "7") as int)
        versionName "8." + (project.findProperty("buildNumber") ?: "0")

        buildConfigField "String", "FCM_APP_ID", "\"${fcm.app}\""
        if (fcm.app) {
            // те же строки, что создаёт плагин google-services: по ним Firebase запускается сам
            resValue "string", "google_app_id", fcm.app
            resValue "string", "gcm_defaultSenderId", fcm.sender
            resValue "string", "google_api_key", fcm.key
            resValue "string", "project_id", fcm.project
        }
    }

    signingConfigs {
        // Постоянный ключ, чтобы обновления ставились поверх старой версии.
        shared {
            storeFile file("../widget.keystore")
            storePassword "android"
            keyAlias "widget"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-messaging"
}

name: Сборка виджета (APK)

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Собрать APK
        working-directory: android
        run: |
          # номер сборки растёт с каждым запуском — по нему приложение понимает, что вышло обновление
          BUILD=$((1000 + GITHUB_RUN_NUMBER))
          gradle --no-daemon assembleRelease -PbuildNumber=$BUILD
          cp app/build/outputs/apk/release/app-release.apk ../svitlo-widget.apk
          echo "{\"versionCode\": $BUILD, \"versionName\": \"8.$BUILD\", \"commit\": \"$GITHUB_SHA\"}" > ../version.json
          cat ../version.json

      - uses: actions/upload-artifact@v4
        with:
          name: svitlo-widget
          path: svitlo-widget.apk

      # Выкладываем APK в релиз: отсюда приложение само берёт обновления.
      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view widget >/dev/null 2>&1; then
            gh release upload widget svitlo-widget.apk version.json --clobber
          else
            gh release create widget svitlo-widget.apk version.json \
              --target "$GITHUB_SHA" \
              --title "Тревога и свет — последняя сборка" \
              --notes "Установочный файл svitlo-widget.apk. Установленное приложение обновляется отсюда само."
          fi

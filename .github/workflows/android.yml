name: Сборка виджета (APK)

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Собрать APK
        working-directory: android
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../svitlo-widget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: svitlo-widget
          path: svitlo-widget.apk

      # На основной ветке выкладываем APK в релиз, чтобы скачать с телефона.
      - name: Опубликовать релиз
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete widget --yes --cleanup-tag || true
          gh release create widget svitlo-widget.apk \
            --title "Виджет «Тревога и свет»" \
            --notes "Скачайте svitlo-widget.apk на телефон и установите."
